<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voo de Porcello</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/galeria.css">
    <link rel="stylesheet" href="css/all.css">
    <link rel="icon" href="img/1.png">
    <script>// verifica ao carregar a página
        window.onload = function () {
            let temaSalvo = localStorage.getItem("tema");

            if (temaSalvo === "light") {
                document.body.classList.add("light");
                document.getElementById("btnTema").innerText = "🌙";
            }
        }

        // alterna o tema
        function alternarTema() {
            let body = document.body;
            let botao = document.getElementById("btnTema");

            body.classList.toggle("light");

            if (body.classList.contains("light")) {
                botao.innerText = "🌙";
                localStorage.setItem("tema", "light");
            } else {
                botao.innerText = "☀️";
                localStorage.setItem("tema", "dark");
            }
        }</script>
</head>

<body>
    <header>
        <a href="index.html">
            <img src="img/o_voo_de_porcello_transparente.png" alt="Voo de Procello">
        </a>
        <nav>
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>
                <li>
                    <a href="galeria.html">
                        Galeria
                    </a>
                </li>
                <li>
                    <a href="historia.html">
                        Historia
                    </a>
                </li>
                <li>
                    <a href="contato.html">
                        Contato
                    </a>
                </li>
                <li>
                    <button id="btnTema" onclick="alternarTema()">☀️</button>
                </li>
                <li>
                    <a href="jogo/index.html" target="_blank">
                        <button>Jogar agora</button></a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="galeria">
            <h2>Galeria de fotos</h2>
            <img src="img/Capturar.PNG" alt="imgJogo1">
            <img src="img/image.png" alt="imgJogo2">
            <img src="img/Capturar10.PNG" alt="imgJogo3">
        </div>
        <div class="stripes">
            <h2>Personagens e Sprites</h2>
            <img src="img/1.png" alt="imgPersonagem">
            <img src="img/baconUp.jpeg" alt="imgBaconUp">
            <img src="img/baconDown.jpeg" alt="imgBaconDown">
        </div>
    </main>
</body>
